[project]
name = "fastapi-111023"
version = "0.1.0"
description = "FastAPI CRUD Service"
readme = "README.md"
authors = [
    { name = "Gaurav Aswani", email = "gauravaswani321@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=8.3.4",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
ignore = ["B008"]
